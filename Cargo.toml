[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "AGPL-3.0-or-later"
repository = "https://github.com/radiator-engineering/ichnos"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
# Internal crates.
ichnos-core = { path = "crates/ichnos-core" }
ichnos-io = { path = "crates/ichnos-io" }
ichnos-model = { path = "crates/ichnos-model" }
ichnos-discovery = { path = "crates/ichnos-discovery" }
ichnos-conformance = { path = "crates/ichnos-conformance" }
ichnos-stats = { path = "crates/ichnos-stats" }
ichnos-org = { path = "crates/ichnos-org" }
ichnos-perf = { path = "crates/ichnos-perf" }
ichnos-sim = { path = "crates/ichnos-sim" }
ichnos-ml = { path = "crates/ichnos-ml" }
ichnos-ocel = { path = "crates/ichnos-ocel" }
ichnos-stream = { path = "crates/ichnos-stream" }
ichnos-privacy = { path = "crates/ichnos-privacy" }
ichnos-viz = { path = "crates/ichnos-viz" }
ichnos-golden = { path = "crates/ichnos-golden" }

# External crates. Add new ones here and use `{ workspace = true }` in the crate.
approx = "0.5.1"
arrow = { version = "60.0.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
csv = "1.4.0"
flate2 = "1.1.10"
good_lp = { version = "1.15.3", default-features = false, features = ["microlp"] }
hashbrown = "0.17.1"
indexmap = "2.14.2"
lasso = "0.7.3"
parquet = { version = "60.0.0", default-features = false }
petgraph = "0.8.3"
quick-xml = "0.42.0"
rand = "0.10.3"
rand_chacha = "0.10.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smallvec = "1.16.2"
thiserror = "2.0.21"
