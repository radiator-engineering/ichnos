[package]
name = "ichnos-io"
description = "Readers and writers: XES, CSV, Parquet, OCEL 2.0 (JSON, XML, SQLite), PNML, PTML and BPMN XML."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ichnos-core = { workspace = true }
ichnos-model = { workspace = true }
ichnos-ocel = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true }
flate2 = { workspace = true }
thiserror = { workspace = true }
csv = { workspace = true }
rusqlite = { workspace = true }
parquet = { workspace = true, features = ["arrow", "snap", "zstd", "flate2-rust_backend", "brotli", "lz4"] }

[dev-dependencies]
ichnos-model = { workspace = true, features = ["serde"] }
ichnos-golden = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
rusqlite = { workspace = true }
chrono = { workspace = true }
